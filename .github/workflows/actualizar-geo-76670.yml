name: Geografía DANE y comparadores UPME
on:
  workflow_dispatch:
  push:
    branches:
      - feat/icet-recuperacion-documental
    paths:
      - 'scripts/extraer_geografia_76670.py'
      - '.github/workflows/actualizar-geo-76670.yml'
permissions:
  contents: write
concurrency:
  group: geo-76670
  cancel-in-progress: false
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/icet-recuperacion-documental
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar geometrías reales del DANE y comparadores UPME
        run: python scripts/extraer_geografia_76670.py
      - name: Versionar recursos geográficos verificados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/geografiaMunicipal76670.json src/data/energiaMunicipiosReferencia.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(geo): geometría DANE y cobertura UPME verificadas'
          git pull --rebase origin feat/icet-recuperacion-documental
          git push origin HEAD:feat/icet-recuperacion-documental
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geografia-dane-76670
          path: |
            src/data/geografiaMunicipal76670.json
            src/data/energiaMunicipiosReferencia.json
          retention-days: 30
