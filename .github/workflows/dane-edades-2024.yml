name: DANE población edad San Pedro 2024
on:
  workflow_dispatch:
  push:
    branches: ['feat/icet-recuperacion-documental']
    paths:
      - scripts/diagnostico_poblacion_edades_2024.py
      - .github/workflows/dane-edades-2024.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
      - run: pip install python-calamine==0.6.1
      - run: python scripts/diagnostico_poblacion_edades_2024.py
