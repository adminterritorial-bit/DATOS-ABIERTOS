name: Production deploy · existing Vercel project
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Quality"]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: institutional-production-vercel
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify release commit is main HEAD
        if: github.event_name == 'workflow_run'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --depth=1
          CURRENT=$(git rev-parse origin/main)
          if [ "$RELEASE_SHA" != "$CURRENT" ]; then
            echo "::notice::Skipping superseded release $RELEASE_SHA, main now at $CURRENT"
            exit 1
          fi
      - name: Verify authorized Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add VERCEL_TOKEN with access to team adminterritorial-3830s-projects to repository secrets."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify release
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run lint
          npm run build
      - name: Deploy ONLY to institutional project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest link --yes --project indicadores-san-pedro --scope adminterritorial-3830s-projects --token "$VERCEL_TOKEN"
          npx --yes vercel@latest pull --yes --environment production --scope adminterritorial-3830s-projects --token "$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --scope adminterritorial-3830s-projects --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --scope adminterritorial-3830s-projects --token "$VERCEL_TOKEN"
