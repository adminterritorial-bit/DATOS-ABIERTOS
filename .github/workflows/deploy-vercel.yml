name: Production deploy · existing Vercel project
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-vercel
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required Vercel authorization
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Set VERCEL_TOKEN with access to team adminterritorial-3830s-projects."
            exit 1
          fi
      - name: Install packages and verify build
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run lint
          npm run build
      - name: Deploy to existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest link --yes --project indicadores-san-pedro --scope adminterritorial-3830s-projects --token "$VERCEL_TOKEN"
          npx --yes vercel@latest pull --yes --environment production --scope adminterritorial-3830s-projects --token "$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --scope adminterritorial-3830s-projects --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --scope adminterritorial-3830s-projects --token "$VERCEL_TOKEN"
