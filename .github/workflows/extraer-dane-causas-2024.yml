name: Extracción causas DANE residentes 2024
on:
  workflow_dispatch:
  push:
    branches: ['feat/icet-recuperacion-documental']
    paths:
      - scripts/extraer_dane_causas_2024.py
      - .github/workflows/extraer-dane-causas-2024.yml
permissions:
  contents: write
concurrency:
  group: dane-causas-2024
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/icet-recuperacion-documental
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-calamine==0.6.1
      - name: Validar y extraer causas de muerte por residencia de San Pedro
        run: python scripts/extraer_dane_causas_2024.py
      - name: Versionar datos públicos agregados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/daneDefunciones76670_2024.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(dane): causas 2024 residentes San Pedro validadas'
          git pull --rebase origin feat/icet-recuperacion-documental
          git push origin HEAD:feat/icet-recuperacion-documental
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dane-causas-residentes-76670
          path: src/data/daneDefunciones76670_2024.json
