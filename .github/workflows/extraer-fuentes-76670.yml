name: Extracción municipal 76670 · UPME y RUV
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1' # lunes 06:00 Colombia (UTC-5)
  push:
    branches:
      - feat/icet-recuperacion-documental
    paths:
      - 'scripts/extraer_fuentes_76670.py'
      - 'scripts/extraer_sspd_anexos_2024.py'
      - '.github/workflows/extraer-fuentes-76670.yml'
concurrency:
  group: municipal-extract-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de libros oficiales
        run: python -m pip install python-calamine==0.6.1
      - name: Extraer anexos nacionales SSPD 2024
        run: python scripts/extraer_sspd_anexos_2024.py
      - name: Descargar respuestas de UPME y UARIV y buscar fuentes INS/SISPRO/SSPD
        run: python scripts/extraer_fuentes_76670.py
      - name: Guardar registros agregados en la rama de investigación
        if: github.ref == 'refs/heads/feat/icet-recuperacion-documental'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/fuentesMasivas76670.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los registros"
          else
            git commit -m 'data(auto): actualizar observaciones municipales 76670 desde fuentes públicas'
            git pull --rebase origin feat/icet-recuperacion-documental
            git push origin HEAD:feat/icet-recuperacion-documental
          fi
      - name: Conservar salida municipal estructurada para ingesta posterior
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuentes-gubernamentales-76670
          path: |
            out/masivo_76670/respuesta_gubernamental_76670.json
            out/sspd_76670/extracto_76670.json
          retention-days: 30
