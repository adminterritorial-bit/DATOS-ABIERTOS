name: Fuentes oficiales · Policía 2025
on:
  workflow_dispatch:
  push:
    branches: ['feat/**']
    paths: ['scripts/ingest_policia_2025.py', '.github/workflows/fuentes-oficiales.yml']
permissions:
  contents: read
jobs:
  police:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install python-calamine==0.6.1
      - name: Retrieve and aggregate San Pedro only
        run: python scripts/ingest_policia_2025.py
      - name: Publish non-identifying draft for manual review
        uses: actions/upload-artifact@v4
        with:
          name: policia-2025-draft-aggregation
          path: out/policia_2025_borrador_agregado.json
          retention-days: 14
