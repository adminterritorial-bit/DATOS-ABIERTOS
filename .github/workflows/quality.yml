name: Quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Statistical integrity and territory guard
        run: python3 scripts/check_statistical_integrity.py
      - name: Type checks
        run: npm run lint
      - name: Build
        run: npm run build
