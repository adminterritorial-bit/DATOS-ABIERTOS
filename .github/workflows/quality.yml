name: Quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Statistical integrity and territory guard
        run: python3 scripts/check_statistical_integrity.py
      - name: Type checks
        run: npm run lint
      - name: Build
        run: npm run build
      - name: HTTP smoke for dashboard, data API and PDF
        run: |
          set -euo pipefail
          npm run start -- --port 3000 > /tmp/observatorio-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:3000/ -o /tmp/observatorio.html; then break; fi
            sleep 2
          done
          grep -q 'Observatorio' /tmp/observatorio.html
          curl -fsS http://127.0.0.1:3000/api/indicadores -o /tmp/indicadores.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/indicadores.json'))
          assert d['divipola']=='76670'
          assert d['total']>=75,d['total']
          assert any(x.get('anio')==2025 and x.get('codigo')=='DANE-POB-TOTAL' and int(x['valor'])==17275 for x in d['observaciones'])
          print('Live Next SSR + API: success',d['total'])
          PY
          curl -fsS 'http://127.0.0.1:3000/api/reporte?anio=2025&sector=Panorama' -o /tmp/reporte.pdf
          head -c 4 /tmp/reporte.pdf | grep -q '%PDF'
          test $(wc -c </tmp/reporte.pdf) -gt 1600
