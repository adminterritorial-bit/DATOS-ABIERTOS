name: Quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Statistical integrity and territory guard
        run: python3 scripts/check_statistical_integrity.py
      - name: Type checks
        run: npm run lint
      - name: Build static GitHub Pages application
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Verify exported HTML routes and assets
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/icet/index.html
          test -f out/catalogo/index.html
          test -f out/poblacion/index.html
          test -f out/seguridad/index.html
          test -f out/pdt/index.html
          test -f out/admin/index.html
          test -f out/escudo-san-pedro.png
          npm run start > /tmp/observatorio-pages.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS http://localhost:3000/DATOS-ABIERTOS/ -o /tmp/index.html; then break; fi
            sleep 2
          done
          grep -q 'Observatorio' /tmp/index.html
          curl -fsS http://localhost:3000/DATOS-ABIERTOS/icet/ -o /tmp/icet.html
          curl -fsS http://localhost:3000/DATOS-ABIERTOS/catalogo/ -o /tmp/catalogo.html
          curl -fsS http://localhost:3000/DATOS-ABIERTOS/escudo-san-pedro.png -o /tmp/escudo.png
          test "$(wc -c </tmp/escudo.png)" -gt 1000
          if grep -R '/api/reporte\|/api/indicadores' src/components/TerritorialDashboard.tsx; then
            echo "::error::Server-only API references remain"
            exit 1
          fi
          echo "PASS: GitHub Pages pages, asset paths and no server APIs"
