name: Visual regression and responsive review
on:
  push:
    branches: ['feat/observatorio-qa-admin']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Screenshots and interaction checks
        run: |
          npm run start -- --port 3000 > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
          trap 'kill $(cat /tmp/web.pid) 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/ -o /dev/null; then break; fi
            sleep 2
          done
          node scripts/visual-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanpedro-observatorio-visual
          path: artifacts/visual/
          retention-days: 14
